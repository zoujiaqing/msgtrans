name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan pushed commits for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          if [ "$EVENT" = pull_request ]; then
            RANGE="$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..$HEAD_SHA"
          else
            RANGE="-1 $HEAD_SHA"
          fi
          CFG=""; [ -f .gitleaks.toml ] && CFG="-c .gitleaks.toml"
          ./gitleaks git . $CFG --log-opts="$RANGE" --redact --no-banner --exit-code 1

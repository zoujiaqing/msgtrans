[package]
name = "msgtrans-ffi"
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["zoujiaqing <zoujiaqing@gmail.com>"]
description = "UniFFI bindings for the msgtrans client (TCP / WebSocket / QUIC) for Kotlin and Swift"
repository = "https://github.com/zoujiaqing/msgtrans-ffi"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
msgtrans = { version = "2.0.0-beta.2", path = "../msgtrans" }
uniffi = "0.31.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
futures = { version = "0.3", default-features = false, features = ["executor"] }
pin-project-lite = "0.2"
thiserror = "2"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
async-trait = "0.1"
rcgen = "0.14"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"

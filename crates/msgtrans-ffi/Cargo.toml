[package]
name = "msgtrans-ffi"
version.workspace = true
edition = "2024"
rust-version = "1.99"
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "UniFFI bindings for the msgtrans client (TCP / WebSocket / QUIC) for Kotlin and Swift"
# Distributed as built libraries (.so / XCFramework) plus generated bindings,
# not as a crate.
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
msgtrans = { path = "../msgtrans" }
uniffi = "0.31.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
futures = { version = "0.3", default-features = false, features = ["executor"] }
pin-project-lite = "0.2"
thiserror = "2"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
async-trait = "0.1"
rcgen = "0.14"

[workspace]
members = ["crates/msgtrans", "crates/msgtrans-ffi"]
# Standalone on purpose: it enables uniffi's `cli` feature, which must not be
# feature-unified into the bindings library.
exclude = ["crates/msgtrans-ffi/uniffi-bindgen"]
# MSRV-aware resolution: dependencies are chosen to build on msgtrans's
# declared rust-version, not just on the pinned toolchain.
resolver = "3"

[workspace.package]
# msgtrans and msgtrans-ffi are versioned in lockstep, so a binding build
# names the library it wraps.
version = "2.0.0-beta.2"
authors = ["Jiaqing Zou <zoujiaqing@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/zoujiaqing/msgtrans"

# Size-optimised profile for the shipped mobile libraries. msgtrans's own
# release builds (examples, load tests, benchmarks) keep the default
# speed-optimised profile, so their numbers stay comparable.
[profile.release-ffi]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
